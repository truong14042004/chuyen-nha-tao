<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#b8241c">
  <title>Nhân sự · Chuyện Nhà Táo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Comforter+Brush&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background: var(--bg); }
    .stf { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; display: grid; gap: 16px; }
    .stf-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .stf-head .brand-name { font-size: 30px; }
    .stf .card { padding: 20px; display: grid; gap: 14px; }
    .stf h2 { font-size: 20px; font-weight: 800; }
    .where { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #b8241c; color: #fff3d6; }
    .where i { font-size: 24px; color: #f3d27a; }
    .where strong { font-size: 17px; flex: 1; }
    .where button { background: none; border: 0; color: #fff3d6; text-decoration: underline; font-size: 14px; min-height: 44px; }
    .places { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .places label { display: flex; gap: 8px; align-items: center; padding: 12px; min-height: 52px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); font-weight: 600; font-size: 15px; }
    .places label:has(input:checked) { border-color: var(--accent); background: rgba(199, 50, 26, .08); color: var(--accent-ink); }
    .places .full { grid-column: 1 / -1; }
    #reader { width: 100%; border-radius: 16px; overflow: hidden; background: #1a0f0a; min-height: 120px; }
    #reader video { border-radius: 16px; }
    .scan-idle { display: grid; place-items: center; gap: 10px; padding: 26px 16px; color: #f6e2b6; text-align: center; }
    .scan-idle i { font-size: 48px; color: #f3d27a; }
    .manual { display: flex; gap: 8px; }
    .manual .input { text-transform: uppercase; font-family: ui-monospace, Consolas, monospace; font-weight: 700; letter-spacing: .06em; }
    .who { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .who strong { font-size: 20px; font-weight: 800; display: block; }
    .who .mono { font-family: ui-monospace, Consolas, monospace; font-weight: 700; color: var(--text-muted); }
    .stamps4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .stamps4 div { display: grid; justify-items: center; gap: 4px; padding: 10px 4px; border-radius: 12px; border: 1px dashed var(--line-strong); font-size: 12px; font-weight: 600; text-align: center; color: var(--text-muted); }
    .stamps4 div i { font-size: 24px; }
    .stamps4 div.on { border-style: solid; border-color: rgba(46, 125, 79, .5); background: rgba(46, 125, 79, .08); color: #1f5a3a; }
    .stamps4 div.here { box-shadow: 0 0 0 2px var(--accent); }
    .stamps4 small { font-size: 11px; font-weight: 500; }
    .verdict { display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 14px; font-weight: 700; font-size: 16px; line-height: 1.4; }
    .verdict i { font-size: 30px; flex: none; }
    .verdict.ok { background: rgba(46, 125, 79, .12); color: #1f5a3a; }
    .verdict.warn { background: var(--gold-soft); color: var(--gold-ink); }
    .verdict.err { background: rgba(198, 40, 40, .1); color: var(--danger); }
    .verdict small { display: block; font-weight: 500; font-size: 14px; }
    .btn-xl { --h: 60px; font-size: 18px; white-space: normal; text-align: center; line-height: 1.3; padding: 10px 18px; }
    .stf, .stf > *, #app > div, .stf .card { min-width: 0; }
    .manual .input { min-width: 0; flex: 1; }
    .log { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
    .log li { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .log small { color: var(--text-muted); white-space: nowrap; }
    .otp { display: grid; gap: 8px; padding: 16px; border-radius: 16px; background: #2a1710; color: #fff3d6; text-align: center; }
    .otp-label { font-size: 14px; font-weight: 600; color: #f3d27a; } .otp-label small { display: block; font-weight: 500; color: #e9d6b8; font-size: 12.5px; }
    .otp-code { font-family: ui-monospace, Consolas, monospace; font-size: 44px; font-weight: 800; letter-spacing: .18em; }
    .otp-bar { height: 5px; border-radius: 3px; background: rgba(255, 243, 214, .2); overflow: hidden; } .otp-bar i { display: block; height: 100%; background: #f3d27a; transform-origin: left; }
    .badge-n { padding: 6px 12px; border-radius: 999px; background: var(--gold-soft); color: var(--gold-ink); font-weight: 800; white-space: nowrap; }
  </style>
</head>
<body>
  <main class="stf">
    <header class="stf-head">
      <span class="brand-name">Chuyện Nhà Táo</span>
      <button class="btn btn-quiet btn-sm" type="button" id="btn-logout" hidden>Đăng xuất</button>
    </header>

    <div class="verdict warn" id="notice" hidden></div>

    <!-- Đăng nhập + chọn nơi đứng -->
    <form class="card" id="login" hidden novalidate>
      <h2><i class="ph ph-identification-badge" aria-hidden="true"></i> Đăng nhập nhân sự</h2>
      <div class="field">
        <label for="stf-key">Mật khẩu nhân sự</label>
        <input class="input" id="stf-key" type="password" autocomplete="current-password" required>
        <p class="error-text" id="login-err" aria-live="polite"></p>
      </div>
      <fieldset style="border:0;padding:0;margin:0;display:grid;gap:8px">
        <legend style="font-weight:600;margin-bottom:8px">Bạn đứng ở đâu?</legend>
        <div class="places" id="places"></div>
      </fieldset>
      <button class="btn btn-primary btn-xl" type="submit">Bắt đầu</button>
    </form>

    <!-- Quét thẻ -->
    <div id="app" hidden>
      <div style="display:grid;gap:16px">
        <div class="where"><i class="ph-fill ph-map-pin" aria-hidden="true"></i><strong id="where-name"></strong><button type="button" id="btn-place">Đổi chỗ</button></div>

        <!-- Mã dự phòng của trạm: người chơi không quét được QR thì nhân sự đọc mã này -->
        <section class="otp" id="otp" hidden aria-live="polite">
          <span class="otp-label">Mã dự phòng của trạm <small>đọc cho người chơi nhập khi không quét được QR</small></span>
          <strong class="otp-code" id="otp-code">······</strong>
          <span class="otp-bar"><i id="otp-bar"></i></span>
        </section>

        <section class="card" id="scan-card" aria-labelledby="scan-title">
          <h2 id="scan-title">Quét QR trên hộ chiếu người chơi</h2>
          <div id="reader"><div class="scan-idle"><i class="ph ph-camera" aria-hidden="true"></i><span>Bấm "Mở camera" rồi đưa QR ở trang thông tin hộ chiếu vào khung.</span></div></div>
          <button class="btn btn-primary btn-xl" type="button" id="btn-cam"><i class="ph ph-camera" aria-hidden="true"></i> Mở camera</button>
          <form class="manual" id="manual" novalidate>
            <label class="sr-only" for="manual-id">Mã thẻ</label>
            <input class="input" id="manual-id" placeholder="Hoặc nhập mã TAO-XXXXXX" autocomplete="off" autocapitalize="characters" spellcheck="false">
            <button class="btn btn-ghost" type="submit">Tra</button>
          </form>
        </section>

        <section class="card" id="result" hidden aria-live="polite"></section>

        <section class="card" aria-labelledby="log-title">
          <h2 id="log-title" style="font-size:17px">Vừa xử lý</h2>
          <ul class="log" id="log"></ul>
        </section>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
  <script src="staff.js" defer></script>
</body>
</html>
